<!doctype html>
<html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Ubah PDF e-BMD (peralatan & mesin, gedung & bangunan) menjadi Excel penyusutan beserta catatan pemeriksaan." />
<title>Penghitung Penyusutan Aset Tetap</title>
<script>
(function () {
  var t;
  try { t = localStorage.getItem('tema'); } catch (e) {}
  if (t !== 'gelap' && t !== 'terang') {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'gelap' : 'terang';
  }
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
